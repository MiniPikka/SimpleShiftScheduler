[package]
name = "shift-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI + TUI for shift scheduling — 班伴 (ShiftMate)"

[[bin]]
name = "banban"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shift-algorithm = { path = "../crates/shift-algorithm", version = "0.1.0" }
shift-statistics = { path = "../crates/shift-statistics", version = "0.1.0" }
leave-optimizer = { path = "../crates/leave-optimizer", version = "0.1.0" }
holiday-engine = { path = "../crates/holiday-engine", version = "0.1.0" }
export-engine = { path = "../crates/export-engine", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.0"
toml = "0.8"
dirs = "5.0"
notify-rust = "4"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
