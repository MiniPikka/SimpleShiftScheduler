[package]
name = "shift-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI + TUI for rotating shift schedules. Check today's shift (with handover: who you take over from / who takes over from you), plan leave with holiday bridge, find common rest days with colleagues, export ICS calendar files, desktop notifications, systemd timer, shell completions (bash/zsh/fish), local HTTP API (7 endpoints), DBus daemon, Waybar JSON output with rich tooltip and terminal popup. Configurable via ~/.config/banban/config.toml — define your own cycle. 18 commands. --lang zh for Chinese."

[[bin]]
name = "banban"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shift-algorithm = { path = "../crates/shift-algorithm", version = "0.1.0" }
shift-statistics = { path = "../crates/shift-statistics", version = "0.1.0" }
leave-optimizer = { path = "../crates/leave-optimizer", version = "0.1.0" }
holiday-engine = { path = "../crates/holiday-engine", version = "0.1.0" }
shift-export = { path = "../crates/shift-export", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
colored = "2.0"
toml = "0.8"
dirs = "5.0"
notify-rust = "4"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
