[workspace]
resolver = "2"
members = [
    "crates/shift-algorithm",
    "crates/shift-statistics",
    "crates/leave-optimizer",
    "crates/holiday-engine",
    "crates/shift-export",
    "cli",
]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MiniPikka/SimpleShiftScheduler"
authors = ["MiniPikka"]
description = "Shift scheduling engine — 班伴 (ShiftMate)"
