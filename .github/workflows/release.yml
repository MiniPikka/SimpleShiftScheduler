name: Build & Release

on:
  push:
    tags:
      - 'app-v*'

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Build Rust FFI bridge for all Android ABIs
        working-directory: flutter/rust
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../android/app/src/main/jniLibs build --release

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build Rust FFI bridge (release)
        working-directory: flutter/rust
        run: cargo build --release

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build Flutter Linux desktop
        working-directory: flutter
        run: flutter build linux --release

      - name: Bundle Rust .so into Flutter build
        run: |
          BUNDLE=flutter/build/linux/x64/release/bundle
          mkdir -p "$BUNDLE/rust/target/release"
          cp flutter/rust/target/release/libshift_flutter_bridge.so "$BUNDLE/rust/target/release/"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/app-v}" >> "$GITHUB_OUTPUT"

      - name: Package tar.gz
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BUNDLE=flutter/build/linux/x64/release/bundle
          PKG_DIR="shiftmate-${VERSION}-x86_64"
          mkdir -p "$PKG_DIR"
          cp -r "$BUNDLE"/* "$PKG_DIR/"

          # Launcher script
          cat > "$PKG_DIR/shiftmate" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/scheduler_cp" "$@"
          EOF
          chmod +x "$PKG_DIR/shiftmate"

          # .desktop file
          if [ -f flutter/shiftmate.desktop ]; then
            cp flutter/shiftmate.desktop "$PKG_DIR/"
          fi

          # Icon
          if [ -f flutter/linux_icon.png ]; then
            cp flutter/linux_icon.png "$PKG_DIR/"
          fi

          tar czf "shiftmate-${VERSION}-linux-x86_64.tar.gz" "$PKG_DIR"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: shiftmate-*-linux-x86_64.tar.gz

  package-widgets:
    name: Desktop Widgets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package KDE Plasmoid
        run: |
          cd plasma
          cd banban-shift@simpleshift.scheduler
          zip -r ../banban-shift.plasmoid . -x "*.git*" -x "install.sh"

      - name: Package GNOME Extension
        run: |
          cd gnome
          cd banban-shift@simpleshift.scheduler
          zip -r ../banban-shift.zip . -x "*.git*" -x "install.sh"

      - name: Upload widget artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-widgets
          path: |
            plasma/banban-shift.plasmoid
            gnome/banban-shift.zip

  release:
    name: Create Release
    needs: [build-android, build-linux, package-widgets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/app-v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          cat > /tmp/changelog.md << EOF
          # ShiftMate v${{ steps.version.outputs.VERSION }}

          ## Downloads

          | 平台 | 文件 | 说明 |
          |------|------|------|
          | Android | \`shiftmate-*.apk\` | Android 安装包 |
          | Linux | \`shiftmate-*-linux-x86_64.tar.gz\` | 解压后运行 \`./shiftmate\` |
          | KDE Plasma 6 | \`banban-shift.plasmoid\` | 系统面板小组件 |
          | GNOME Shell 45+ | \`banban-shift.zip\` | 顶栏扩展 |

          ## Changes

          $CHANGELOG
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ShiftMate v${{ steps.version.outputs.VERSION }}
          body_path: /tmp/changelog.md
          files: |
            artifacts/android-apk/app-release.apk
            artifacts/linux-tarball/shiftmate-*-linux-x86_64.tar.gz
            artifacts/desktop-widgets/plasma/banban-shift.plasmoid
            artifacts/desktop-widgets/gnome/banban-shift.zip
          generate_release_notes: false
